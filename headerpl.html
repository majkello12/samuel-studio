}, 4000);

<script>
document.addEventListener('DOMContentLoaded', function () {
  const slides = Array.from(document.querySelectorAll('.carousel-slide0'));
  if (!slides.length) return;

  let current = 0;
  let autoplayInterval = null;
  const INTERVAL_MS = 4000;

  const prevBtn = document.querySelector('.nav.prev');
  const nextBtn = document.querySelector('.nav.next');
  const container = document.querySelector('.carousel-container0');

  function showSlide(index) {
    index = (index + slides.length) % slides.length;
    slides.forEach((s, i) => s.classList.toggle('active', i === index));
    current = index;
  }

  function startAutoplay(){
    stopAutoplay();
    autoplayInterval = setInterval(() => showSlide(current + 1), INTERVAL_MS);
  }

  function stopAutoplay(){
    if (autoplayInterval) {
      clearInterval(autoplayInterval);
      autoplayInterval = null;
    }
  }

  prevBtn.addEventListener('click', () => {
    showSlide(current - 1);
    startAutoplay(); 
  });
  nextBtn.addEventListener('click', () => {
    showSlide(current + 1);
    startAutoplay(); 
  });

  container.addEventListener('mouseenter', stopAutoplay);
  container.addEventListener('mouseleave', startAutoplay);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') { showSlide(current - 1); startAutoplay(); }
    if (e.key === 'ArrowRight') { showSlide(current + 1); startAutoplay(); }
  });

  showSlide(0);
  startAutoplay();
});
</script>

<script>
document.querySelectorAll('.gallery-item').forEach(item => {
  const video = item.querySelector('video');

  item.addEventListener('mouseenter', () => {
    if (window.innerWidth > 768) {
      video.play();
    }
  });

  item.addEventListener('mouseleave', () => {
    if (window.innerWidth > 768) {
      video.pause();
      video.currentTime = 0;
    }
  });
});

if (window.innerWidth <= 768) {
  const videos = document.querySelectorAll(".gallery-item video");

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.play().catch(err => {
          console.log("Autoplay blocked:", err);
        });
      } else {
        entry.target.pause();
        entry.target.currentTime = 0;
      }
    });
  }, { threshold: 0.5 }); 
  videos.forEach(video => {
    video.muted = true; 
    video.setAttribute("playsinline", "true"); 
    video.setAttribute("autoplay", "true"); // 
    observer.observe(video);
  });
}
</script>

<script>
const futureTexts = [
  "Będziesz mieć animowane logo, Twoja marka się wyróżni.",
  "Twoje wykłady przyciągną uwagę słuchaczy.",
  "Wytłumaczysz złożone tematy w angażujący sposób.",
  "Twoje wydarzenia będą cieszyć się dużą frekwencją, poczujesz się doceniony"
];

document.querySelectorAll('.gallery-item-offerta').forEach((item, idx) => {
  const caption = item.querySelector('.gallery-caption-offerta p');
  if (!caption) return;
  const original = caption.textContent;



  if (window.innerWidth > 768) {
    item.addEventListener('mouseenter', () => {
      caption.style.opacity = '0';
      setTimeout(() => {
        caption.textContent = futureTexts[idx] || original;
        caption.style.opacity = '1';
      }, 300);
    });


      item.addEventListener('mouseenter', () => {
    caption.style.opacity = '0';
    setTimeout(() => {
      caption.textContent = futureTexts[idx] || original;
      caption.style.opacity = '1';
    }, 180);
  });


    item.addEventListener('mouseleave', () => {
      caption.style.opacity = '0';
      setTimeout(() => {
        caption.textContent = original;
        caption.style.opacity = '1';
      }, 180);
    });
  }

  if (window.innerWidth <= 768) {
    let showingFuture = false;
    setInterval(() => {
      caption.style.opacity = '0';
      setTimeout(() => {
        caption.textContent = showingFuture ? original : futureTexts[idx] || original;
        caption.style.opacity = '1';
        showingFuture = !showingFuture;
      }, 300);
    }, 4000); 
  }
});
</script>
